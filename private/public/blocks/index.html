<!DOCTYPE html>
<html>
<head>
<script>
	document.getElementById("body").addEventListener("load", myFunction);

function myFunction() {
  alert('loaded');
}

</script>
</head>
<body id='body'>

<p>This example uses the addEventListener() method to attach a "load" event to an iframe element.</p>

<p id="demo"></p>

</body>
</html>
