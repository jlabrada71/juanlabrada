<html>
<head>
    <meta charset="utf-8"/>
    <title>PGHB Test Project</title>
    <meta name="viewport" content="width=device-width, initial-scale=0.86, maximum-scale=5.0, minimum-scale=0.86">
    <style>
        /* do not change the css */
        div {
            display: block;
            width: 200px;
            height: 100px;
            margin-bottom: 5px;
        }
    </style>
    <script>
        /*
            ver 1.1

            Instructions:

            1- ensure no console errors (including declaring the character encoding)
            2- fix mobile viewport scaling
        
            3- fix console log ordering
                zeroeth, first, second, third, fourth, fifth, sixth

            4- ensure no duplicate console logs
            5- keep the existing log statements in their current functions

            6- a queue is a list of functions to be called
            7- ensure a queue can be executed multiple times without running the functions multiple times
            8- ensure a queued function will not prevent the next queued function from running
            
            9- if a function is added to a queue inside of another queue it must be kept there
            
            10- set divs background-color to blue (but not do-not-show-me-div)
                first-div, second-div, third-div, fourth-div, fifth-div
            11- do not change the css or divs
            12- add queue4 that asks a user to continue before running the other queues
            13- add a console log in a body script that outputs seventh after sixth
        */
        function init() {
            window.processQueues = true;
            window.shouldLogSeventh = false;
            const queue = [];
            const queue2 = [];
            const queue3 = [];
            const queue4 = [];
            const queues = {
                queue: queue,
                queue2: queue2,
                queue3: queue3,
                queue4: queue4
            };

            window.execute = function(queue) {
                if( ! window.processQueues ) return;
                queue = queues[queue];
                while(queue.length > 0) {
                    let fn = queue.shift();
                    try {
                        fn.call();
                    }
                    catch(e) {
                        // console.log('usually do something');
                    }
                }
            };

            queue4.push(function() {
                if(!confirm('do you want to continue?')) {
                    queues['queue'] = [];
                    queues['queue2'] = [];
                    queues['queue3'] = [];
                    queues['queue4'] = [];
                };
            })
            queue.unshift(function() {
                console.log('zeroeth');
            });
            
            queue.push(function() {
                console.log('first');
                queue2.push(function() {
                    console.log('third');
                });
                window.execute('queue2'); // must come after the above
                // do not change the following line
                const ids = ['first', 'second', 'third', 'fourth', 'fifth', 'sixth'];
                ids.forEach(function(id) {
                    const itemId = id + '-div'
                    console.log(itemId);
                    let item = document.getElementById(itemId) || 
                               document.querySelector(`div[data-id="${itemId}"]`);
                    
                    item.style['background-color'] = 'blue';
                });
                queue2.push(function() {
                    console.log('fourth');
                    // do not change the following line
                    throw new Error('handle me');
                });
                queue2.push(function() {
                    console.log('fifth');
                    queue3.push(function () {
                        console.log('sixth');
                    });
                });
            });
            queue2.unshift(function() {
                console.log('second');
            });
            return queues;
        }
    </script>
</head>
<body>
    <!-- do not change divs -->
    <div id="first-div"></div>
    <div id="second-div"></div>
    <div id="third-div"></div>
    <div class="div" data-id="fourth-div"></div>
    <div class="div" data-id="fifth-div"></div>
    <div class="div" data-id="sixth-div"></div>
    <div class="div" data-id="do-not-show-me-div"></div>
    <script>
        const queues = init();
        window.execute('queue4');
        window.execute('queue');
        window.execute('queue2');
        
        queues['queue3'].push(function () {
            console.log('seventh');
        });

        let count = 10;
        let endless = function() {
            console.log('endless');
            if(count>0) {
                queues['queue3'].push(endless);
                count--;
            }
        }
        queues['queue3'].push(endless);
        
        window.execute('queue3'); 
    </script>
</body>
</html>
